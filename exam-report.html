<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёт об экзамене — Hospital Academy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="report-page">
    <nav class="navbar">
        <div class="logo">Hospital Academy</div>
        <ul class="nav-menu">
            <li><a href="index.html">Главная</a></li>
            <li><a href="recruitment-report.html">Отчёт о наборе</a></li>
            <li><a href="exam-report.html" class="active">Отчёт об экзамене</a></li>
            <li><a href="weekly-report.html">Еженедельный отчёт HA</a></li>
            <li><a href="about.html">О нас</a></li>
        </ul>
    </nav>

    <main class="report-form">
        <h2>Отчёт об экзамене</h2>
        <form id="examForm">
            <!-- 1. Кто принимал экзамен (текстовое поле) -->
            <div class="form-group">
                <label for="examiner">Кто принимал экзамен? (Имя Фамилия | CID)</label>
                <input
                    type="text"
                    id="examiner"
                    name="examiner"
                    placeholder="Например: Maksim Hartford | CQ18"
                    required
                >
            </div>

            <!-- 2. У кого принимали -->
            <div class="form-group">
                <label>У кого принимали?</label>
                <div class="input-group">
                    <label for="candidateName">Имя и фамилия:</label>
                    <input
                        type="text"
                        id="candidateName"
                        name="candidateName"
                        placeholder="Имя Фамилия"
                        required
                    >
                    
                    <label for="candidateCID">CID:</label>
                    <input
                        type="text"
                        id="candidateCID"
                        name="candidateCID"
                        placeholder="CID"
                        required
                    >
                </div>
            </div>

            <!-- 3. Список экзаменов -->
            <div class="form-group">
                <label>Список экзаменов (выберите один или несколько):</label>
                <div class="checkbox-group">
                    <div>
                        <label for="oath">
                            <input type="checkbox" id="oath" name="exams" value="Клятва Врача">
                            📕 | Клятва Врача
                        </label>
                    </div>
                    <div>
                        <label for="charter">
                            <input type="checkbox" id="charter" name="exams" value="Устав">
                            📔 | Устав
                        </label>
                    </div>
                    <div>
                        <label for="medicines">
                            <input type="checkbox" id="medicines" name="exams" value="Медикаменты">
                            💊 | Медикаменты
                        </label>
                    </div>
                    <div>
                        <label for="tenCodes">
                            <input type="checkbox" id="tenCodes" name="exams" value="Тен-коды">
                            📗 | Тен-коды
                        </label>
                    </div>
            <div>
                <label for="transport">
                    <input type="checkbox" id="transport" name="exams" value="Транспорт больницы">
                    🚑 | Транспорт больницы
                </label>
            </div>
            <div>
                <label for="radioRegulations">
                    <input type="checkbox" id="radioRegulations" name="exams" value="Положение о радиосвязи">
                    📘 | Положение об использовании радиосвязи
                </label>
            </div>
        </div>
    </div>

    <!-- 4. Результат: Сдал / Не сдал -->
    <div class="form-group">
        <label>Результат:</label>
        <div class="radio-group">
            <label for="passed">
                <input type="radio" id="passed" name="result" value="Сдал" required>
                Сдал ✅
            </label>
            <label for="failed">
                <input type="radio" id="failed" name="result" value="Не сдал">
                Не сдал ❌
            </label>
        </div>
    </div>

    <!-- Кнопка отправки -->
    <button type="submit" class="submit-btn">Отправить отчёт в Discord</button>
</form>
</main>

<script src="exam-script.js"></script>
</body>
</html>
